<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>retro-games</title>
  <link rel="icon" href="favicon.ico">
  <style>
    html, body { margin: 0; background: #120e0a; color: #f4e6c8; font-family: ui-monospace, "Courier New", monospace; }
    main { max-width: 28rem; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 { letter-spacing: 0.12em; font-size: 1.4rem; color: #f2d36a; }
    p { color: #a89880; }
    a { color: #f4e6c8; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.8rem 0; }
    a.game {
      display: block;
      padding: 0.9rem 1rem;
      border: 2px solid #6a5030;
      background: #1a140c;
      text-decoration: none;
    }
    a.game strong { display: block; color: #f2d36a; letter-spacing: 0.08em; }
    a.game span { color: #a89880; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>RETRO GAMES</h1>
    <p>Phone-sized games. Nothing here phones home.</p>
    <ul>
      <li>
        <a class="game" href="lantern-heir/">
          <strong>LANTERN HEIR</strong>
          <span>Top-down, turn-based. Cross Duskreach and set the five lamps.</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
